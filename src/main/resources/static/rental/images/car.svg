<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="windowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bgGrad)" rx="16" />
  <!-- Road -->
  <line x1="20" y1="190" x2="380" y2="190" stroke="#334155" stroke-width="4" stroke-dasharray="16,8" />
  <!-- Car Shadow -->
  <ellipse cx="200" cy="188" rx="140" ry="12" fill="#000" opacity="0.35" />
  <!-- Car Body -->
  <path d="M 60,150 Q 60,140 80,135 L 125,130 L 160,85 Q 170,75 190,75 L 265,75 Q 285,75 305,95 L 335,130 L 345,140 Q 355,145 355,160 L 355,170 Q 355,175 345,175 L 310,175 Q 300,155 275,155 Q 250,155 240,175 L 160,175 Q 150,155 125,155 Q 100,155 90,175 L 65,175 Q 60,175 60,170 Z" fill="url(#carBody)" />
  <!-- Windows -->
  <path d="M 165,90 L 138,128 L 215,128 L 215,88 L 180,88 Q 170,88 165,90 Z" fill="url(#windowGrad)" />
  <path d="M 225,88 L 225,128 L 320,128 L 295,95 Q 285,88 270,88 Z" fill="url(#windowGrad)" />
  <!-- Headlight -->
  <polygon points="340,140 355,145 355,155 335,155" fill="#fef08a" />
  <!-- Taillight -->
  <rect x="60" y="145" width="10" height="15" rx="3" fill="#ef4444" />
  <!-- Wheels -->
  <circle cx="125" cy="175" r="26" fill="#1e293b" stroke="#64748b" stroke-width="6" />
  <circle cx="125" cy="175" r="10" fill="#cbd5e1" />
  <circle cx="275" cy="175" r="26" fill="#1e293b" stroke="#64748b" stroke-width="6" />
  <circle cx="275" cy="175" r="10" fill="#cbd5e1" />
  <!-- Badge -->
  <rect x="15" y="15" width="100" height="26" rx="13" fill="#06b6d4" fill-opacity="0.2" />
  <text x="65" y="32" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">CAR RENTAL</text>
</svg>
