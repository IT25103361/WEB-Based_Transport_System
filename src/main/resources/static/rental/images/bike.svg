<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradBike" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="bikeBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bgGradBike)" rx="16" />
  <line x1="20" y1="190" x2="380" y2="190" stroke="#334155" stroke-width="4" stroke-dasharray="16,8" />
  <ellipse cx="200" cy="188" rx="130" ry="10" fill="#000" opacity="0.35" />
  <!-- Wheels -->
  <circle cx="110" cy="165" r="32" fill="#1e293b" stroke="#64748b" stroke-width="6" />
  <circle cx="110" cy="165" r="14" fill="#cbd5e1" />
  <circle cx="290" cy="165" r="32" fill="#1e293b" stroke="#64748b" stroke-width="6" />
  <circle cx="290" cy="165" r="14" fill="#cbd5e1" />
  <!-- Bike Frame -->
  <path d="M 110,165 L 180,165 L 230,120 L 160,120 Z" fill="none" stroke="url(#bikeBody)" stroke-width="10" stroke-linejoin="round" />
  <path d="M 180,165 L 210,105 L 285,105" fill="none" stroke="url(#bikeBody)" stroke-width="8" stroke-linecap="round" />
  <path d="M 290,165 L 260,95 L 275,85" fill="none" stroke="#64748b" stroke-width="7" stroke-linecap="round" />
  <!-- Handlebars -->
  <line x1="250" y1="85" x2="285" y2="85" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
  <!-- Seat -->
  <path d="M 145,115 Q 165,105 195,115" stroke="#334155" stroke-width="10" stroke-linecap="round" fill="none" />
  <!-- Fuel Tank -->
  <path d="M 200,118 Q 230,100 250,115 Q 230,128 200,118 Z" fill="url(#bikeBody)" />
  <!-- Headlight -->
  <circle cx="285" cy="98" r="8" fill="#fef08a" />
  <rect x="15" y="15" width="105" height="26" rx="13" fill="#10b981" fill-opacity="0.2" />
  <text x="67" y="32" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#34d399" text-anchor="middle">BIKE RENTAL</text>
</svg>
